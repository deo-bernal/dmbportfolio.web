# Self-hosted n8n on Render's free web plan.
# Free services cannot attach a disk, so n8n stores workflows in Supabase
# Postgres instead of /home/node/.n8n.
#
# New > Blueprint > repo deo-bernal/dmbportfolio.web
# Branch: AiAutomationShowCase
# Path: automation/n8n/render.yaml
#
# Fill every sync:false value in the Render dashboard. Never put secrets here.
services:
  - type: web
    name: dmb-n8n
    runtime: image
    plan: free
    region: singapore
    image:
      url: docker.io/n8nio/n8n:latest
    healthCheckPath: /healthz
    envVars:
      - key: N8N_PORT
        value: "10000"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        fromService:
          type: web
          name: dmb-n8n
          property: host
      - key: WEBHOOK_URL
        value: https://dmb-n8n.onrender.com/
      - key: GENERIC_TIMEZONE
        value: Asia/Manila
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_RUNNERS_ENABLED
        value: "true"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_SCHEMA
        value: n8n
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_DATABASE
        sync: false
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        sync: false
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false
      - key: N8N_WEBHOOK_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: LEADS_FROM_EMAIL
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
