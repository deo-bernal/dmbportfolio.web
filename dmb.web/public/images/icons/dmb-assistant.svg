<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="DMB Assistant">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </radialGradient>
    <linearGradient id="face" x1="48" y1="52" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="visor" x1="52" y1="68" x2="108" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular launcher face -->
  <circle cx="80" cy="80" r="78" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="74" fill="none" stroke="#b91c1c" stroke-width="3.5" opacity="0.9"/>

  <!-- Soft highlight -->
  <ellipse cx="62" cy="46" rx="34" ry="18" fill="#ffffff" opacity="0.08"/>

  <!-- Ear cups -->
  <rect x="28" y="72" width="14" height="26" rx="7" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <rect x="118" y="72" width="14" height="26" rx="7" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="35" cy="85" r="4" fill="#b91c1c" filter="url(#glow)"/>
  <circle cx="125" cy="85" r="4" fill="#b91c1c" filter="url(#glow)"/>

  <!-- Helmet / head shell -->
  <path d="M48 86c0-22 14-38 32-38s32 16 32 38v18c0 8-7 14-16 14H64c-9 0-16-6-16-14V86z" fill="#162032"/>
  <path d="M54 84c0-18 11-31 26-31s26 13 26 31" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Profile badge on top (DMB accent instead of roof) -->
  <rect x="70" y="28" width="20" height="14" rx="4" fill="#b91c1c"/>
  <circle cx="80" cy="24" r="5" fill="#f87171" filter="url(#glow)"/>
  <path d="M74 33.5h12" stroke="#fecaca" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Faceplate -->
  <path d="M56 78c0-14 10-24 24-24s24 10 24 24v16c0 10-8 18-18 18H74c-10 0-18-8-18-18V78z" fill="url(#face)"/>

  <!-- Glowing visor / eyes -->
  <rect x="60" y="74" width="40" height="16" rx="8" fill="#0f172a"/>
  <rect x="62" y="76" width="36" height="12" rx="6" fill="url(#visor)" filter="url(#glow)"/>
  <circle cx="72" cy="82" r="2.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="96" cy="82" r="2.2" fill="#ffffff" opacity="0.9"/>

  <!-- Smile -->
  <path d="M70 100c4 5 16 5 20 0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Chin plate -->
  <path d="M66 112h28c2 0 4 2 4 4v2c0 4-4 8-10 8H72c-6 0-10-4-10-8v-2c0-2 2-4 4-4z" fill="#1e293b"/>
</svg>
