name: Keep API warm (Vercel)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm Render API
        run: |
          curl -fsS -o /dev/null -w "render=%{time_total}s code=%{http_code}\n" \
            "https://dmbportfolio-api.onrender.com/api/publicprofile?username=deobernal@gmail.com" \
            --max-time 120

      - name: Warm Vercel cached proxy
        run: |
          curl -fsS -o /dev/null -w "vercel=%{time_total}s code=%{http_code}\n" \
            "https://www.dmbwebsolutions.com/api/publicprofile?username=deobernal@gmail.com" \
            --max-time 120
