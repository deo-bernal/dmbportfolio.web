name: Keep API warm (Azure)

# Disabled: dmbportfolio-api.azurewebsites.net is not live yet.
# Re-enable the cron below after the Azure App Service is deployed.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm Azure API
        run: |
          curl -fsS -o /dev/null -w "azure=%{time_total}s code=%{http_code}\n" \
            "https://dmbportfolio-api.azurewebsites.net/api/publicprofile?username=deobernal@gmail.com" \
            --max-time 120
